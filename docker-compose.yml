services:
  taicai-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${TAICAI_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      MYSQL_HOST: ${MYSQL_HOST_DOCKER:-host.docker.internal}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./outputs/tai_cai_tracker/data/paper_ledger.jsonl:/app/outputs/tai_cai_tracker/data/paper_ledger.jsonl:ro
    command:
      - /bin/sh
      - -c
      - >-
        python -m outputs.tai_cai_tracker.cli sync-service-projection
        outputs/tai_cai_tracker/data/paper_ledger.jsonl
        && exec python -m outputs.tai_cai_tracker.cli serve-api
        outputs/tai_cai_tracker/data/paper_ledger.jsonl --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
